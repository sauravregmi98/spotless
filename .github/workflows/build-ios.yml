name: Build Spotless iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen and iOS Rust target
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Build Rust iOS core and generate Xcode project
        run: |
          chmod +x scripts/build-ios-core.sh
          ./scripts/build-ios-core.sh
          cd ios/Encore && xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/Encore/Encore.xcodeproj \
            -scheme Encore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Spotless.ipa Payload

      - name: Upload Spotless.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Spotless-IPA
          path: Spotless.ipa

