name: Build Spotless iOS IPA

on: workflow_dispatch

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen mpv
          rustup update stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust iOS core and generate Xcode project
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$LIBRARY_PATH"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          scripts/build-ios-core.sh --release
          cd ios/Encore
          xcodegen generate

      - name: Build unsigned iOS app
        working-directory: ios/Encore
        run: |
          xcodebuild -project Encore.xcodeproj -scheme Encore \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        working-directory: ios/Encore
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Spotless.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Spotless-ipa
          path: ios/Encore/Spotless.ipa
